# A fresh install, signed in to the sample household, on Home.
appId: com.plexbie.app
---
- launchApp:
    clearState: true
# The sign-in set: its tally, or its keys if the page opened further down (a keyboard left
# up by the last app can scroll it as it opens).
- extendedWaitUntil:
    visible: "Standby|Sign in with Discord|How to get in"
    timeout: 20000
# The set fills the first screen; the other ways in are under it.
- scrollUntilVisible:
    element:
      text: "Look around with sample data"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Look around with sample data"
- extendedWaitUntil:
    visible: "Just arrived"
    timeout: 20000
