# First launch: the sign-in screen, with both sign-ins and the sample.
appId: com.plexbie.app
tags: [smoke]
---
- launchApp:
    clearState: true
# The set's screen is at the top: its tally waits on Standby. A keyboard left up by the last
# flow can open the page further down (as in subflows/sample.yaml), so find the set, then its top.
- extendedWaitUntil:
    visible: "Standby|Sign in with Discord|How to get in"
    timeout: 20000
- scrollUntilVisible:
    element: "Standby"
    direction: UP
- assertVisible: "Standby"
- assertVisible: "CH 1.*Sign in"
# The keys are on the set's deck, under the screen; the sample is below the set.
- scrollUntilVisible:
    element:
      text: "Sign in with Discord"
    direction: DOWN
- assertVisible: "Sign in with Discord"
- scrollUntilVisible:
    element:
      text: "Sign in with Plex"
    direction: DOWN
- assertVisible: "Sign in with Plex"
- scrollUntilVisible:
    element:
      text: "Look around with sample data"
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible: "Look around with sample data"
